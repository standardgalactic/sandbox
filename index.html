<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Essays · Visualizer</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1016;color:#e7edf2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.player{width:min(900px,100%)}.eyebrow{font-size:12px;letter-spacing:.19em;text-transform:uppercase;color:#91a5b6}h1{font-weight:500;font-size:clamp(24px,4vw,40px);line-height:1.2;margin:14px 0 22px}canvas{width:100%;height:260px;display:block;background:#101923;border:1px solid #273543;border-radius:8px}.controls{display:flex;align-items:center;gap:15px;margin-top:20px;flex-wrap:wrap}button,select{background:#192633;border:1px solid #3b5060;border-radius:6px;color:#edf5f9;padding:11px 14px;font:inherit}button{cursor:pointer}button:hover,select:hover{background:#253849}select{width:100%;margin-top:8px}.picker{margin-top:26px}label{display:block;color:#b6c7d2;font-size:13px}.time{font-variant-numeric:tabular-nums;color:#9fb2c0;font-size:13px;white-space:nowrap}input[type=range]{accent-color:#9fc6d6;flex:1;min-width:150px}.captions{margin-top:14px;min-height:76px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 18px;border:1px solid #273543;border-radius:8px;background:#101923;font-size:clamp(15px,2.4vw,20px);line-height:1.5;color:#f0f5f8}.captions[hidden]{display:none}.footer{margin-top:20px;color:#8095a5;font-size:12px;line-height:1.6}#status{color:#e0b9a0;min-height:1.5em;font-size:13px;margin-top:10px}a{color:#a6cbdc}
</style></head><body><main class="player"><div class="eyebrow">Audio essays / listening room</div><h1 id="title">The Hidden Geometry of Gesture Typing</h1><canvas id="visual" aria-label="Audio frequency visualizer"></canvas><div class="controls"><button id="play" aria-label="Play or pause">▶ Play</button><span class="time" id="current">0:00</span><input id="seek" aria-label="Seek position" type="range" min="0" max="1000" value="0"><span class="time" id="duration">0:00</span><button id="mute" aria-label="Mute or unmute">Sound on</button></div><div class="captions" id="captions" aria-live="off">Subtitles will appear here during playback.</div><div class="picker"><label for="track">Select recording</label><select id="track"></select></div><div class="controls"><button id="toggleCaptions" aria-pressed="true">CC On</button><span class="time" id="captionStatus">Subtitles: awaiting VTT</span></div><p id="status" role="status"></p><p class="footer">Share a recording using <code>?track=1</code> through <code>?track=4</code>, or use its full MP3 filename. Selecting a track updates the address without reloading the page.</p><audio id="audio" preload="metadata" crossorigin="anonymous"><track id="subtitleTrack" kind="subtitles" srclang="en" label="English"></audio></main><script>
const tracks=[
{file:'The_Hidden_Geometry_of_Gesture_Typing.mp3',title:'The Hidden Geometry of Gesture Typing'},
{file:'Why_Memory_Is_A_Reconstructive_Illusion.mp3',title:'Why Memory Is a Reconstructive Illusion'},
{file:'Why_Democratizing_the_Economy_Isn_t_Enough.mp3',title:"Why Democratizing the Economy Isn't Enough"},
{file:'Why_the_Global_Monsoon_Seesaw_Breaks.mp3',title:'Why the Global Monsoon Seesaw Breaks'}];
const audio=document.querySelector('#audio'),canvas=document.querySelector('#visual'),ctx=canvas.getContext('2d'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),sel=document.querySelector('#track'),status=document.querySelector('#status');
tracks.forEach((t,i)=>sel.add(new Option(t.title,String(i))));let index=0,ac,analyser,source,frequency,ccEnabled=true;
const captions=document.querySelector('#captions'),captionStatus=document.querySelector('#captionStatus'),ccButton=document.querySelector('#toggleCaptions'),subtitleTrack=document.querySelector('#subtitleTrack');
function updateCaption(){if(!ccEnabled)return;const active=Array.from(subtitleTrack.track?.activeCues||[]);captions.textContent=active.map(c=>c.text).join('\n')||' ';}
function activateCaptions(){const tt=subtitleTrack.track;if(tt){tt.mode='hidden';tt.oncuechange=updateCaption;}updateCaption();}
ccButton.onclick=()=>{ccEnabled=!ccEnabled;captions.hidden=!ccEnabled;ccButton.textContent=ccEnabled?'CC On':'CC Off';ccButton.setAttribute('aria-pressed',String(ccEnabled));if(ccEnabled)updateCaption();};
subtitleTrack.addEventListener('load',()=>{captionStatus.textContent='Subtitles loaded';activateCaptions()});subtitleTrack.addEventListener('error',()=>{captionStatus.textContent='VTT unavailable';captions.textContent='Subtitles unavailable for this recording.'});
function resolve(){const v=new URL(location.href).searchParams.get('track');if(!v)return 0;const n=Number(v);if(/^\d+$/.test(v)&&n>=1&&n<=tracks.length)return n-1;return Math.max(0,tracks.findIndex(t=>t.file===v||t.file.replace(/\.mp3$/i,'')===v));}
function setTrack(i,update=true,autoplay=false){index=i;const t=tracks[i];audio.pause();subtitleTrack.track.mode='disabled';subtitleTrack.src=encodeURIComponent(t.file.replace(/\.mp3$/i,'.vtt'));audio.src=encodeURIComponent(t.file);audio.load();captionStatus.textContent='Loading subtitles…';captions.textContent=' ';activateCaptions();sel.value=String(i);document.querySelector('#title').textContent=t.title;document.title=t.title+' · Audio Essays';seek.value=0;play.textContent='▶ Play';status.textContent='';if(update){const u=new URL(location.href);u.searchParams.set('track',String(i+1));history.pushState({track:i},'',u)}if(autoplay)start();}
function setup(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();analyser=ac.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.82;source=ac.createMediaElementSource(audio);source.connect(analyser);analyser.connect(ac.destination);frequency=new Uint8Array(analyser.frequencyBinCount)}
async function start(){try{setup();await ac.resume();await audio.play();play.textContent='Ⅱ Pause';status.textContent=''}catch(e){status.textContent='Could not play this file. Confirm the MP3 exists beside this page and is served over HTTP(S).';}}
play.onclick=()=>audio.paused?start():(audio.pause(),play.textContent='▶ Play');sel.onchange=()=>setTrack(Number(sel.value),true,!audio.paused);audio.onended=()=>play.textContent='▶ Play';audio.onpause=()=>play.textContent='▶ Play';audio.onplay=()=>play.textContent='Ⅱ Pause';audio.onerror=()=>status.textContent='Audio unavailable: '+tracks[index].file;
const fmt=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';audio.ontimeupdate=()=>{updateCaption();document.querySelector('#current').textContent=fmt(audio.currentTime);if(Number.isFinite(audio.duration))seek.value=Math.round(audio.currentTime/audio.duration*1000)};audio.onloadedmetadata=()=>document.querySelector('#duration').textContent=fmt(audio.duration);seek.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(seek.value)/1000*audio.duration};document.querySelector('#mute').onclick=()=>{audio.muted=!audio.muted;document.querySelector('#mute').textContent=audio.muted?'Muted':'Sound on'};window.onpopstate=()=>setTrack(resolve(),false);
function draw(){const dpr=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle='#101923';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#243341';ctx.lineWidth=1;for(let j=1;j<5;j++){const y=h*j/5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}if(analyser)analyser.getByteFrequencyData(frequency);const bars=Math.max(32,Math.min(120,Math.floor(w/7))),gap=2,bw=w/bars-gap;for(let i=0;i<bars;i++){const p=i/(bars-1),bin=Math.floor(Math.pow(p,1.65)*Math.min(700,frequency?.length-1||700)),v=frequency?frequency[bin]/255:0,amp=Math.max(2,v*v*(h-28));ctx.fillStyle=`rgba(142,196,216,${.35+.6*v})`;ctx.fillRect(i*w/bars,h-12-amp,bw,amp)}requestAnimationFrame(draw)}setTrack(resolve(),false);draw();
</script></body></html>
